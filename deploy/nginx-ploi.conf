# Full nginx configuration for squaberry.co.uk on Ploi (PHP site, isolated user squaberry-wzh0k).
# Paste into Ploi: Site > Manage > NGINX configuration, then Save (Ploi tests and reloads nginx).
#
# The repository root IS the web root (there is no /public folder), so in Ploi also set
# Site > Settings > Web directory to "/" so `root` below stays correct if Ploi regenerates it.
#
# The site is fully static: the contact form posts to FormSubmit (formsubmit.co), so no PHP runs here.

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/squaberry.co.uk/before/*;

server {
    listen 80;
    listen [::]:80;

    root /home/squaberry-wzh0k/squaberry.co.uk;
    server_name squaberry.co.uk;

    include /etc/nginx/ssl/squaberry.co.uk;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/squaberry.co.uk/server/*;

    # Static site: serve files as they are; unknown paths are a plain 404.
    location / {
        try_files $uri $uri/ =404;
    }

    access_log off;
    error_log  /var/log/nginx/squaberry.co.uk-error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static site: never serve or run PHP.
    location ~ \.php$ {
        return 404;
    }

    # Keep deploy notes, project docs and the local dev server private.
    location ~* ^/(deploy/|CLAUDE\.md$|agents\.md$|AGENTS\.md$|preview-server\.cjs$) {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/squaberry.co.uk/after/*;
