# nginx configuration for squaberry.co.uk on Ploi (Next.js app, isolated user squaberry-wzh0k).
# Paste into Ploi: Site > Manage > NGINX configuration, then Save (Ploi tests and reloads nginx).
#
# nginx serves nothing from disk: every request is proxied to the Next.js server, which a Ploi
# daemon keeps running on 127.0.0.1:3090 (see deploy/ploi-deploy.md). Keep the port here and in
# the daemon in sync.

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/squaberry.co.uk/before/*;

server {
    listen 80;
    listen [::]:80;

    server_name squaberry.co.uk;

    include /etc/nginx/ssl/squaberry.co.uk;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/squaberry.co.uk/server/*;

    access_log off;
    error_log  /var/log/nginx/squaberry.co.uk-error.log error;

    # Let's Encrypt certificate renewal.
    location ~ /.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Never expose dotfiles (.env, .git) even if a request reaches this far.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so visitors can't spoof the IP the enquiry rate limit uses.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 1m;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/squaberry.co.uk/after/*;
