# nginx additions for squaberry.co.uk on Ploi (static HTML site).
#
# In Ploi: Site > Manage > NGINX configuration. Paste the location blocks below INSIDE the
# existing `server { ... }` block for port 443, above the default `location / { ... }` block.
# Keep everything Ploi already generated (SSL, root, index, try_files). Then Save, which
# tests and reloads nginx.
#
# Before pasting, check the PHP-FPM socket name on the server:
#   ls /var/run/php/
# and change php8.3-fpm.sock below to match the version that is installed.

    # Contact form handler: the only PHP file that may run on this site.
    location = /contact-submit.php {
        limit_except POST { deny all; }
        client_max_body_size 32k;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/contact-submit.php;
        fastcgi_param SQUABERRY_MAIL_CONFIG /home/ploi/.squaberry/mail.ini;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    # Never serve or run any other PHP file.
    location ~ \.php$ {
        return 404;
    }

    # Keep repository and tooling files private (.git, .claude, docs, deploy notes, dev server).
    # /.well-known stays reachable for Let's Encrypt certificate renewal.
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* ^/(deploy/|CLAUDE\.md$|agents\.md$|AGENTS\.md$|preview-server\.cjs$) {
        return 404;
    }
